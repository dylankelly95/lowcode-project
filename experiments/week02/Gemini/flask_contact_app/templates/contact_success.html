<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message Sent</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; padding: 40px 16px; margin: 0; text-align: center; }
        .card { max-width: 440px; margin: 0 auto; background: #ffffff; padding: 32px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .badge { display: inline-flex; align-items: center; justify-content: center; width: 48px; height: 48px; background: #dcfce7; color: #166534; border-radius: 50%; font-size: 24px; margin-bottom: 16px; }
        a { display: inline-block; margin-top: 16px; color: #4f46e5; font-weight: 600; text-decoration: none; }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">✓</div>
        <h2>Message Sent Successfully!</h2>
        <p>Thank you, <strong>{{ name }}</strong>. Your message has been received.</p>
        <a href="{{ url_for('contact') }}">← Back to contact form</a>
    </div>
</body>
</html>
